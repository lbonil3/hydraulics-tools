<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2c3e50">
  <title>Storm Designer – storm water design game</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8C%A7%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
<header id="hud">
  <a class="hbtn" href="../" aria-label="Back to Hydraulics Tools home">⌂</a>
  <button type="button" class="hbtn" id="btnLevels" aria-label="Level select">☰</button>
  <div class="hud-title"><b id="lvlName">Storm Designer</b><span id="lvlGoal"></span></div>
  <button type="button" class="chip" id="forecastChip" aria-label="Design storm">☁ <span id="forecastLabel">10-yr</span></button>
  <div class="chip money" aria-live="polite">$<span id="budgetLeft">0</span></div>
  <button type="button" class="hbtn" id="muteBtn" aria-label="Sound on" aria-pressed="false">🔊</button>
</header>

<main id="stage">
  <canvas id="view" aria-label="Isometric site. Tap a tile to place the selected drainage element. Drag to pan."></canvas>
  <div class="zoom">
    <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
    <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
    <button type="button" id="ugBtn" aria-label="Underground view" title="Underground view: pipes and HGL (U)">⛏</button>
    <button type="button" id="flowView" aria-label="Toggle flow view" title="Flow view (F)">≋</button>
    <button type="button" id="hintBtn" aria-label="Hint" title="Hint (H)">💡</button>
  </div>
  <div id="tileTip" class="tiletip hidden" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="banner" class="banner hidden"></div>
  <div id="tileInfo" class="tileinfo hidden"></div>
  <canvas id="chart" class="hidden" width="320" height="96" aria-label="Live hydrograph"></canvas>
  <div id="legend" class="legend hidden"></div>
  <div id="stormHud" class="stormhud hidden">
    <span id="stormLabel">Storm</span>
    <button type="button" id="speedBtn">1×</button>
    <button type="button" id="skipBtn">Skip ▶▶</button>
  </div>
</main>

<section id="infoCard" class="infocard hidden" aria-live="polite"></section>
<div id="opts" class="opts" aria-label="Tool options"></div>
<nav id="toolbar" aria-label="Build tools">
  <div class="tools" id="tools"></div>
  <div class="actions">
    <button type="button" id="undoBtn" class="act" aria-label="Undo">↶<small>Undo</small></button>
    <button type="button" id="runBtn" class="run">🌧 Run Storm</button>
  </div>
</nav>

<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>

<footer class="foot">Game rules are simplified for play; follow the TxDOT Hydraulic Design Manual for real designs. Sources: <a href="rules-sources.md">rules-sources.md</a></footer>

<script src="../drainage/calc.js"></script>
<script src="../culvert/calc.js"></script>
<script src="../storm/calc.js"></script>
<script src="../rational/calc.js"></script>
<script src="sim.js"></script>
<script src="../swp3-game/pick.js"></script>
<script src="../swp3-game/art.js"></script>
<script src="art.js"></script>
<script src="sound.js"></script>
<script src="solutions.js"></script>
<script src="game.js"></script>
</body>
</html>
