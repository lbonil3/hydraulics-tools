<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/png" href="../icon-192.png">
  <title>Project Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="testbar" role="note"><b>Testing mode:</b> data is NOT encrypted on this device. It stays only in this browser &mdash; export a backup regularly.</div>
<header class="top">
  <a class="home" href="../" aria-label="Back to Hydraulics Tools home">&#8592;</a>
  <button type="button" class="ibtn railbtn" id="railBtn" aria-label="Show overview" aria-controls="rail" aria-expanded="false">&#9776;</button>
  <div class="brand"><h1 id="appTitle">Project Tracker</h1><span id="saved" class="saved" aria-live="polite"></span></div>
  <div class="search"><label for="q" class="sr">Search</label><input id="q" type="search" placeholder="Search sheets, segments, roads…  ( / )" autocomplete="off"></div>
  <div class="filters" id="filters">
    <label class="sr" for="fStatus">Filter by status</label><select id="fStatus"></select>
    <label class="sr" for="fOwner">Filter by owner</label><select id="fOwner"></select>
    <label class="sr" for="fDisc">Filter by discipline</label><select id="fDisc"></select>
    <label class="sr" for="fFlag">Filter by connector flag</label><select id="fFlag"></select>
  </div>
  <div class="seg-toggle" role="group" aria-label="View">
    <button type="button" id="vTree" aria-pressed="true">Tree</button>
    <button type="button" id="vList" aria-pressed="false">List</button>
    <button type="button" id="vWeek" aria-pressed="false" title="This week: overdue, due soon, blocked, update, ready">Week</button>
    <button type="button" id="vBoard" aria-pressed="false" title="Status board: drag sheets between statuses">Board</button>
  </div>
  <div class="tools">
    <button type="button" class="ibtn" id="undoBtn" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo" disabled>&#8630;</button>
    <button type="button" class="ibtn" id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo" disabled>&#8631;</button>
    <button type="button" class="ibtn" id="tlBtn" aria-pressed="true" title="Station timeline (t)">Timeline</button>
    <button type="button" class="ibtn" id="idxBtn" title="Project sheet index">Sheet index</button>
    <button type="button" class="ibtn" id="ppBtn" title="PP sheet calculator">PP calc</button>
    <button type="button" class="ibtn" id="msBtn" title="Milestones">Milestones</button>
    <button type="button" class="ibtn" id="staffBtn" title="Staff &amp; workload">Staff</button>
    <button type="button" class="ibtn" id="setBtn" title="Settings, backup, export">Settings</button>
    <button type="button" class="ibtn" id="themeBtn" aria-label="Toggle dark mode" title="Light / dark">&#9681;</button>
  </div>
</header>
<div class="layout" id="layout">
  <aside id="rail" aria-label="Project overview"></aside>
  <main id="center">
    <div id="treeWrap" class="treewrap">
      <div id="viewport" class="viewport" aria-label="Project tree. Drag to pan, wheel or pinch to zoom." tabindex="0">
        <div id="stage" class="stage"><svg id="edges" class="edges" aria-hidden="true"></svg><div id="nodes"></div><svg id="links" class="links" aria-hidden="true"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"></path></marker></defs><g id="linkG"></g><path id="dragLine" class="dragline" d=""></path></svg></div>
      </div>
      <div class="zoombar" role="group" aria-label="Tree controls">
        <button type="button" class="ibtn" id="zIn" aria-label="Zoom in">+</button>
        <button type="button" class="ibtn" id="zOut" aria-label="Zoom out">&minus;</button>
        <button type="button" class="ibtn" id="zFit" title="Fit to screen (f)">Fit</button>
        <button type="button" class="ibtn" id="xAll" title="Expand all">Expand all</button>
        <button type="button" class="ibtn" id="cAll" title="Collapse to segments">Collapse</button>
        <div class="seg-toggle branch-toggle" role="group" aria-label="Discipline branches">
          <button type="button" id="bBoth" aria-pressed="true" title="Show both discipline branches">Both</button>
          <button type="button" id="bDr" aria-pressed="false" title="Show only the Drainage branch">Drainage</button>
          <button type="button" id="bSw" aria-pressed="false" title="Show only the SWP3 branch">SWP3</button>
        </div>
        <button type="button" class="ibtn" id="lkBtn" aria-pressed="true" title="Show / hide connectors (c)">Connectors</button>
        <button type="button" class="ibtn" id="lkSelBtn" aria-pressed="false" title="Only connectors of the selected item">Only selected</button>
      </div>
      <div class="legend" aria-hidden="true"><span class="lg st-not-started">Not started</span><span class="lg st-in-progress">In progress</span><span class="lg st-in-review">In review</span><span class="lg st-done">Done</span><span class="chip dr">DR</span>Drainage <span class="chip sw">SW</span>SWP3 <span class="lk lk-cross"></span>Cross-project <span class="lk lk-same"></span>Same <span class="lk lk-upd"></span>Update</div>
    </div>
    <div id="listWrap" class="listwrap" hidden></div>
    <div id="weekWrap" class="listwrap viewwrap" hidden></div>
    <div id="boardWrap" class="listwrap viewwrap" hidden></div>
    <section id="timeline" class="timeline" aria-label="Station timeline"></section>
  </main>
  <aside id="drawer" aria-label="Details" hidden></aside>
</div>
<div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" class="ibtn" id="modalClose" aria-label="Close">&times;</button></div><div id="modalBody" class="modal-body"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="crypto.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
