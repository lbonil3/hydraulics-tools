<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/png" href="../icon-192.png">
  <title>Project Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="testbar" role="note"><b>Testing mode:</b> data is NOT encrypted on this device. It stays only in this browser &mdash; export a backup regularly.</div>
<header class="top">
  <a class="home" href="../" aria-label="Back to Hydraulics Tools home">&#8592;</a>
  <button type="button" class="ibtn railbtn" id="railBtn" aria-label="Show overview" aria-controls="rail" aria-expanded="false">&#9776;</button>
  <div class="brand"><h1 id="appTitle">Project Tracker</h1><span id="saved" class="saved" aria-live="polite"></span></div>
  <div class="search"><label for="q" class="sr">Search</label><input id="q" type="search" placeholder="Search sheets, sections, roads…  ( / )" autocomplete="off"></div>
  <details class="menu filtmenu" id="filtMenu">
    <summary class="ibtn" title="Filter the tree and list by status, owner, discipline or connector flag">Filters<span id="filtCount" class="mcount" hidden></span><span class="caret" aria-hidden="true">&#9662;</span></summary>
    <div class="menupop">
      <div class="filters" id="filters">
        <label class="sr" for="fStatus">Filter by status</label><select id="fStatus"></select>
        <label class="sr" for="fOwner">Filter by owner</label><select id="fOwner"></select>
        <label class="sr" for="fDisc">Filter by discipline</label><select id="fDisc"></select>
        <label class="sr" for="fFlag">Filter by connector flag</label><select id="fFlag"></select>
      </div>
    </div>
  </details>
  <div class="seg-toggle views" role="group" aria-label="View">
    <button type="button" id="vTree" aria-pressed="true">Tree</button>
    <button type="button" id="vList" aria-pressed="false">List</button>
    <button type="button" id="vWeek" aria-pressed="false" title="This week: overdue, due soon, blocked, update, ready">Week</button>
    <button type="button" id="vBoard" aria-pressed="false" title="Status board: drag sheets between statuses">Board</button>
    <button type="button" id="vStations" aria-pressed="false" title="Stations table: edit start/end/scale of every road entry">Stations</button>
    <button type="button" id="vReport" aria-pressed="false" title="Written project report with your notes">Report</button>
  </div>
  <div class="tools">
    <button type="button" class="ibtn" id="carryFindBtn" title="Find sheets a later package repeats from an earlier package">Find carry-ons</button>
    <button type="button" class="ibtn" id="cmdkBtn" title="Jump to anything (Ctrl/Cmd+K)" aria-label="Command palette">&#8984;K</button>
    <button type="button" class="ibtn" id="undoBtn" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo" disabled>&#8630;</button>
    <button type="button" class="ibtn" id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo" disabled>&#8631;</button>
    <details class="menu" id="planMenu">
      <summary class="ibtn" title="Sheet index, PP calculator, milestones, CSV import">Plan<span class="caret" aria-hidden="true">&#9662;</span></summary>
      <div class="menupop" role="menu">
        <button type="button" class="mitem" role="menuitem" id="idxBtn" title="Project sheet index">Sheet index</button>
        <button type="button" class="mitem" role="menuitem" id="ppBtn" title="PP sheet calculator">PP calc</button>
        <button type="button" class="mitem" role="menuitem" id="msBtn" title="Milestones">Milestones</button>
        <button type="button" class="mitem" role="menuitem" id="csvBtn" title="Import roads and sheets from a CSV or pasted Excel rows (or drop a .csv anywhere)">Import CSV</button>
      </div>
    </details>
    <details class="menu" id="peopleMenu">
      <summary class="ibtn" title="Staff and workload">People<span class="caret" aria-hidden="true">&#9662;</span></summary>
      <div class="menupop" role="menu">
        <button type="button" class="mitem" role="menuitem" id="staffBtn" title="Staff &amp; workload">Staff &amp; workload</button>
      </div>
    </details>
    <details class="menu" id="outMenu">
      <summary class="ibtn" title="Print the report, backup, export, settings">Output<span class="caret" aria-hidden="true">&#9662;</span></summary>
      <div class="menupop right" role="menu">
        <button type="button" class="mitem" role="menuitem" id="printBtn" title="Print the status report (or save as PDF)">Print report</button>
        <button type="button" class="mitem" role="menuitem" id="setBtn" title="Settings, backup, export">Settings, backup &amp; export</button>
      </div>
    </details>
    <button type="button" class="ibtn" id="themeBtn" aria-label="Toggle dark mode" title="Light / dark">&#9681;</button>
  </div>
</header>
<div class="layout" id="layout">
  <aside id="rail" aria-label="Project overview"></aside>
  <main id="center">
    <div id="treeWrap" class="treewrap">
      <div id="viewport" class="viewport" aria-label="Project tree. Drag to pan, wheel or pinch to zoom." tabindex="0">
        <div id="stage" class="stage"><svg id="edges" class="edges" aria-hidden="true"></svg><div id="nodes"></div><svg id="links" class="links" aria-hidden="true"><defs><marker id="arw-blk" class="arw arw-blk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="strokeWidth" orient="auto"><path d="M0 0.8L10 5L0 9.2L2.6 5z"></path></marker><marker id="arw-ok" class="arw arw-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="strokeWidth" orient="auto"><path d="M0 0.8L10 5L0 9.2L2.6 5z"></path></marker><marker id="arw-upd" class="arw arw-upd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="strokeWidth" orient="auto"><path d="M0 0.8L10 5L0 9.2L2.6 5z"></path></marker><marker id="arw-info" class="arw arw-info" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="strokeWidth" orient="auto"><path d="M0 0.8L10 5L0 9.2L2.6 5z"></path></marker><marker id="arw-drag" class="arw arw-drag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="strokeWidth" orient="auto"><path d="M0 0.8L10 5L0 9.2L2.6 5z"></path></marker><marker id="arw-dragok" class="arw arw-dragok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="strokeWidth" orient="auto"><path d="M0 0.8L10 5L0 9.2L2.6 5z"></path></marker><marker id="arw-dragbad" class="arw arw-dragbad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="strokeWidth" orient="auto"><path d="M0 0.8L10 5L0 9.2L2.6 5z"></path></marker></defs><g id="linkG"></g></svg><svg id="dragSvg" class="dragsvg" aria-hidden="true"><path id="dragLine" class="dragline" d="" marker-end="url(#arw-drag)"></path></svg></div>
      </div>
      <div id="dragTip" class="dragtip" hidden></div>
      <div class="zoombar" role="group" aria-label="Tree controls">
        <button type="button" class="ibtn" id="zIn" aria-label="Zoom in">+</button>
        <button type="button" class="ibtn" id="zOut" aria-label="Zoom out">&minus;</button>
        <button type="button" class="ibtn" id="zFit" title="Fit to screen (f)">Fit</button>
        <button type="button" class="ibtn" id="xAll" title="Expand all">Expand all</button>
        <button type="button" class="ibtn" id="cAll" title="Collapse to sub-projects">Collapse all</button>
        <label class="sr" for="lvlSel">Show tree to level</label><select id="lvlSel" class="lvlsel" title="Show to level"><option value="">Show to…</option><option value="0">Project</option><option value="1">Disciplines</option><option value="2">Sub-projects</option><option value="3">Sections</option><option value="4">Roads</option><option value="5">Sheets</option></select>
        <div class="seg-toggle branch-toggle" role="group" aria-label="Discipline branches">
          <button type="button" id="bBoth" aria-pressed="true" title="Show both discipline branches">Both</button>
          <button type="button" id="bDr" aria-pressed="false" title="Show only the Drainage branch">Drainage</button>
          <button type="button" id="bSw" aria-pressed="false" title="Show only the SWP3 branch">SWP3</button>
        </div>
        <button type="button" class="ibtn" id="lkBtn" aria-pressed="true" title="Show / hide connectors (c)">Connectors</button>
        <button type="button" class="ibtn" id="lkSelBtn" aria-pressed="false" title="Only connectors of the selected item">Only selected</button>
      </div>
      <div class="legend" aria-hidden="true"><span class="lg st-not-started">Not started</span><span class="lg st-in-progress">In progress</span><span class="lg st-in-review">In review</span><span class="lg st-done">Done</span><span class="chip dr">DR</span>Drainage <span class="chip sw">SW</span>SWP3 <span class="lkgrp"><span class="lk ls-blk"></span>Prereq. open</span><span class="lkgrp"><span class="lk ls-ok"></span>Prereq. done</span><span class="lkgrp"><span class="lk ls-upd"></span>Needs update</span><span class="lkgrp"><span class="lk ls-info"></span>Update link</span><span class="lkgrp"><span class="lkport hollow"></span>Cross-project</span></div>
    </div>
    <div id="listWrap" class="listwrap" hidden></div>
    <div id="weekWrap" class="listwrap viewwrap" hidden></div>
    <div id="boardWrap" class="listwrap viewwrap" hidden></div>
    <div id="stationsWrap" class="listwrap viewwrap" hidden></div>
    <div id="reportWrap" class="listwrap viewwrap" hidden></div>
  </main>
  <aside id="drawer" aria-label="Details" hidden></aside>
</div>
<div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" class="ibtn" id="modalClose" aria-label="Close">&times;</button></div><div id="modalBody" class="modal-body"></div></div></div>
<section id="report" class="report" aria-label="Printable status report"></section>
<div id="toast" role="status" aria-live="polite"></div>
<script src="crypto.js"></script>
<script src="model.js"></script>
<script src="linkgeom.js"></script>
<script src="engreport.js"></script>
<script src="workreport.js"></script>
<script src="app.js"></script>
</body>
</html>
